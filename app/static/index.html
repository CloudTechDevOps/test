<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KubeRay Gemini Agent</title>
<style>
  :root {
    --bg: #0f172a; --panel: #111827; --border: #1f2937; --text: #e5e7eb; --muted: #9ca3af;
    --user: #2563eb; --bot: #1f2937; --accent: #38bdf8; --error: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  .status { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #22c55e; } .dot.down { background: var(--error); }
  button {
    font: inherit; cursor: pointer; border-radius: .5rem; border: 1px solid var(--border);
    background: transparent; color: var(--text); padding: .4rem .8rem;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { flex: 1; overflow-y: auto; padding: 1.5rem 1rem; }
  #log { max-width: 48rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .msg { padding: .75rem 1rem; border-radius: .9rem; line-height: 1.5; max-width: 85%;
         white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: .2rem; }
  .msg.assistant { background: var(--bot); align-self: flex-start; border-bottom-left-radius: .2rem; }
  .msg.error { background: transparent; border: 1px solid var(--error); color: var(--error); align-self: flex-start; }
  .msg pre { background: #0b1220; padding: .6rem; border-radius: .4rem; overflow-x: auto; white-space: pre; }
  .msg code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  .welcome { text-align: center; color: var(--muted); margin-top: 10vh; }
  .welcome h2 { color: var(--text); margin-bottom: .25rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1rem; }
  .typing span { display: inline-block; width: .45rem; height: .45rem; margin: 0 .1rem; border-radius: 50%;
                 background: var(--muted); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .7; } }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: .75rem 1rem; }
  .composer { max-width: 48rem; margin: 0 auto; display: flex; gap: .5rem; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 10rem; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: .6rem; padding: .6rem .8rem;
  }
  #send { background: var(--user); border-color: var(--user); padding: .6rem 1.1rem; }
  .hint { max-width: 48rem; margin: .35rem auto 0; font-size: .75rem; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>KubeRay Gemini Agent</h1>
  <div class="status" role="status" aria-live="polite">
    <span id="dot" class="dot" aria-hidden="true"></span><span id="status-text">Checking…</span>
  </div>
  <button id="clear" type="button">New chat</button>
</header>

<main id="scroller">
  <div id="log" role="log" aria-live="polite" aria-label="Conversation">
    <div class="welcome" id="welcome">
      <h2>How can I help?</h2>
      <p>Ask a question to get started.</p>
      <div class="chips">
        <button type="button" class="chip">Explain KubeRay in 3 bullet points</button>
      </div>
    </div>
  </div>
</main>

<form id="form">
  <div class="composer">
    <label for="input" class="sr-only">Message</label>
    <textarea id="input" rows="1" maxlength="4000" placeholder="Type a message…" required></textarea>
    <button id="send" type="submit">Send</button>
  </div>
  <p class="hint">Enter to send · Shift+Enter for a new line</p>
</form>

<script>
(() => {
  const MAX_HISTORY = 20;
  const log = document.getElementById("log");
  const scroller = document.getElementById("scroller");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];
  let busy = false;

  // Render model text safely: no innerHTML; supports ```code blocks```, `inline code` and **bold**.
  function render(el, text) {
    text.split(/```(?:[\w-]*\n)?/).forEach((chunk, i) => {
      if (i % 2 === 1) {
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = chunk.replace(/\n$/, "");
        pre.appendChild(code);
        el.appendChild(pre);
        return;
      }
      chunk.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach(part => {
        if (/^`[^`]+`$/.test(part)) {
          const c = document.createElement("code"); c.textContent = part.slice(1, -1); el.appendChild(c);
        } else if (/^\*\*[^*]+\*\*$/.test(part)) {
          const b = document.createElement("strong"); b.textContent = part.slice(2, -2); el.appendChild(b);
        } else if (part) {
          el.appendChild(document.createTextNode(part));
        }
      });
    });
  }

  function add(role, text) {
    document.getElementById("welcome")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") render(div, text); else div.textContent = text;
    log.appendChild(div);
    scroller.scrollTop = scroller.scrollHeight;
    return div;
  }

  function typing() {
    const div = add("assistant", "");
    div.classList.add("typing");
    div.setAttribute("aria-label", "Assistant is typing");
    div.innerHTML = "<span></span><span></span><span></span>";
    return div;
  }

  async function ask(message) {
    if (busy || !message.trim()) return;
    busy = true; send.disabled = true;
    add("user", message);
    const pending = typing();
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history: history.slice(-MAX_HISTORY) }),
      });
      const data = await res.json().catch(() => ({}));
      pending.remove();
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed (" + res.status + ")");
      const answer = data.answer || "(empty response)";
      add("assistant", answer);
      history.push({ role: "user", content: message }, { role: "assistant", content: answer });
    } catch (err) {
      pending.remove();
      add("error", "Error: " + err.message);
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const msg = input.value;
    input.value = ""; input.style.height = "auto";
    ask(msg);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
  });

  log.addEventListener("click", e => {
    if (e.target.classList.contains("chip")) ask(e.target.textContent);
  });

  document.getElementById("clear").addEventListener("click", () => location.reload());

  fetch("/healthz").then(r => r.ok ? r.json() : Promise.reject())
    .then(d => { document.getElementById("dot").className = "dot ok";
                 document.getElementById("status-text").textContent = "Online · " + d.model; })
    .catch(() => { document.getElementById("dot").className = "dot down";
                   document.getElementById("status-text").textContent = "Offline"; });

  input.focus();
})();
</script>
</body>
</html>
