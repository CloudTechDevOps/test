apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ai-agent
  namespace: default
spec:
  serveConfigV2: |
    applications:
      - name: agent
        import_path: app:app
        route_prefix: /
  rayClusterConfig:
    rayVersion: "2.40.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
      template:
        spec:
          containers:
            - name: ray-head
              image: __IMAGE__
              env:
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gemini-secret
                      key: api-key
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              resources:
                requests:
                  cpu: "500m"
                  memory: "2Gi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
    workerGroupSpecs:
      - groupName: workers
        # Initial worker pods
        replicas: 1
        # KubeRay worker autoscaling
        minReplicas: 1
        maxReplicas: 2
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: __IMAGE__
                env:
                  - name: GEMINI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: gemini-secret
                        key: api-key
                resources:
                  requests:
                    cpu: "500m"
                    memory: "2Gi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"
